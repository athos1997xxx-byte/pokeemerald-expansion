name: Build GBA ROM

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-rom.yml'
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build:
    name: Build pokeemerald-expansion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-expansion
          path: pokeemerald.gba
          if-no-files-found: error

# rebuild trigger
